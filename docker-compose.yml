services:
  jetbrains-marketplace-stats:
    container_name: jetbrains-marketplace-stats
    image: jansorg/jetbrains-marketplace-stats:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
        # -- Required ---: You have to add your own JetBrains Marketplace API key here
      - MARKETPLACE_API_KEY=your-api-key
        # Defines which currency is used to display monetary amounts
      - MARKETPLACE_DISPLAY_CURRENCY=USD
      - MARKETPLACE_SERVER_PORT=8080
        # none, normal or verbose
      - MARKETPLACE_LOG_LEVEL=none
        # the image stores the persistent cache in /root/.cache/marketplace-stats, it speeds up restarts.
        # An empty value disables it.
      #- MARKETPLACE_CACHE_DIR=
        # the sales and downloads of all paid plugins are shown above the list of plugins, which needs their data.
        # It's loaded at the start, or taken from the persistent cache. Set to false to disable it.
      #- MARKETPLACE_ALL_PLUGINS_SUMMARY=true
        # the MCP server for AI agents at /mcp, e.g. http://localhost:8080/mcp, is enabled by default.
        # It has no authentication, like the web interface. Set to false to disable it.
      #- MARKETPLACE_MCP=true
        # MCP requests are only accepted for the hostnames localhost, 127.0.0.1 and [::1].
        # Add the hostnames used to access the server from other machines, comma-separated, ports are ignored.
      #- MARKETPLACE_MCP_ALLOWED_HOSTS=my-server,my-server.example.com
        # language settings, change this to configure formatting of numbers and currency amounts
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US:en
      - LC_ALL=en_US.UTF-8
    # keeps the persistent cache when the container is replaced, e.g. by a new version
    volumes:
      - marketplace-stats-cache:/root/.cache/marketplace-stats
      # To store the cache in a directory of the host instead, replace the line above with a bind mount, e.g.
      # "- ./cache:/root/.cache/marketplace-stats" (relative to this file) or an absolute path like
      # "- /srv/marketplace-stats/cache:/root/.cache/marketplace-stats", and remove the "volumes:" section at the end.
      # Docker creates a missing directory. The container runs as root, so the files are owned by root.
      # The cache contains your sales data, restrict the access to the directory.

volumes:
  marketplace-stats-cache:
